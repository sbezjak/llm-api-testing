[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
log_level = "INFO"
log_format = "%(asctime)s %(levelname)-7s %(name)s | %(message)s"
log_date_format = "%H:%M:%S"
markers = [
    "ollama: test requires a running local Ollama server (slow, integration)",
    "mocked: test uses respx to mock Ollama (fast, hermetic)",
]

[project]
name = "llm-api-testing"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "anyio[trio]>=4.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]
